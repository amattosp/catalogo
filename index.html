<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo Fitness</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#e9ecef;--card:#fff;--ink:#16181d;--mute:#5d6470;--line:#d5d9df;--acc:#0f5c5a;--acc-ink:#fff;--bad:#a4262c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--ink:#f1f3f5;--mute:#9aa2ae;--line:#32363d;--acc:#4fc3bd;--acc-ink:#0b1d1c;--bad:#ff8a8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--ink:#f1f3f5;--mute:#9aa2ae;--line:#32363d;--acc:#4fc3bd;--acc-ink:#0b1d1c;--bad:#ff8a8f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
header{max-width:1100px;margin:0 auto;padding:28px 16px 12px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(28px,6vw,44px);line-height:1;font-weight:800;letter-spacing:-.02em}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.meta input{width:auto;min-width:200px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.del{color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;padding:12px 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.card.off{opacity:.55}
.hero{aspect-ratio:3/4;width:100%;object-fit:cover;display:block;background:var(--line)}
.thumbs{display:flex;gap:6px;padding:8px 10px 0}
.thumbs img{width:48px;height:64px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}
.thumbs img.on{border-color:var(--acc)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h2{margin:0;font-size:20px;font-weight:800}
.price{font-weight:600;color:var(--acc);font-size:18px}
.desc{color:var(--mute);font-size:14px;margin:0}
.tag{font-size:13px;color:var(--mute)}
.inc{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:auto;padding-top:6px}
.inc input{width:auto}
.acts{display:flex;gap:8px;margin-top:6px}.acts button{flex:1;padding:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 10px}
dialog{border:none;border-radius:16px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:22px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--mute);cursor:pointer;background-size:cover;background-position:center}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0}
.slot .x{position:absolute;top:4px;right:4px;z-index:2;padding:2px 8px;font-size:12px;background:var(--card)}
.foot{display:flex;justify-content:flex-end;gap:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}
</style></head><body>
<header>
 <div><h1 id="t">Catálogo</h1>
  <div class="meta"><input id="store" placeholder="Nome da loja"><input id="zap" placeholder="WhatsApp (ex: 21 99999-0000)" inputmode="tel"></div></div>
 <div class="bar"><button class="pri" id="add">Novo modelo</button><button id="pdf">Gerar catálogo PDF</button></div>
</header>
<main id="grid"></main>
<dialog id="dlg"><div class="dlg">
 <h3 id="dt">Novo modelo</h3>
 <label class="f">Nome do modelo<input id="fn" maxlength="80"></label>
 <label class="f">Descrição<textarea id="fd" rows="4" maxlength="500"></textarea></label>
 <div class="two"><label class="f">Preço (R$)<input id="fp" inputmode="decimal" placeholder="149,90"></label>
 <label class="f">Tamanhos<input id="fs" placeholder="P, M, G"></label></div>
 <label class="f">Cores<input id="fc" placeholder="Branco, Preto"></label>
 <div class="f" style="font-size:14px;font-weight:600">Fotos (2 a 3)</div>
 <div class="slots" id="slots"></div>
 <div class="foot"><button id="cx">Cancelar</button><button class="pri" id="sv">Salvar modelo</button></div>
</div></dialog>
<div id="toast"></div>

let S=null,edit=null,pics=[null,null,null];
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.items)S=JSON.parse(JSON.stringify(SEED));
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast("Memória cheia. Exclua modelos antigos ou use fotos menores.");return false}}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3500)}
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function render(){
 $("t").textContent=S.store||"Catálogo";document.title=S.store||"Catálogo";
 $("store").value=S.store||"";$("zap").value=S.zap||"";
 const g=$("grid");g.textContent="";
 if(!S.items.length){g.appendChild(el("div","empty","Nenhum modelo cadastrado. Toque em Novo modelo para começar."));return}
 S.items.forEach((it,i)=>{
  const c=el("div","card"+(it.inc===false?" off":""));
  const h=el("img","hero");h.src=it.photos[0];h.alt=it.name;c.appendChild(h);
  const th=el("div","thumbs");
  it.photos.forEach((p,k)=>{const t=el("img",k?"":"on");t.src=p;t.alt="Foto "+(k+1);t.onclick=()=>{h.src=p;th.querySelectorAll("img").forEach(x=>x.classList.remove("on"));t.classList.add("on")};th.appendChild(t)});
  c.appendChild(th);
  const b=el("div","body");
  b.appendChild(el("h2","",it.name));b.appendChild(el("div","price",money(it.price)));
  if(it.desc)b.appendChild(el("p","desc",it.desc));
  if(it.sizes)b.appendChild(el("div","tag","Tamanhos: "+it.sizes));
  if(it.colors)b.appendChild(el("div","tag","Cores: "+it.colors));
  const inc=el("label","inc");const cb=document.createElement("input");cb.type="checkbox";cb.checked=it.inc!==false;
  cb.onchange=()=>{it.inc=cb.checked;persist();render()};inc.appendChild(cb);inc.appendChild(document.createTextNode("Incluir no catálogo PDF"));b.appendChild(inc);
  const a=el("div","acts");const e=el("button","","Editar");e.onclick=()=>open(i);
  const d=el("button","del","Excluir");let arm=false;
  d.onclick=()=>{if(!arm){arm=true;d.textContent="Confirmar?";setTimeout(()=>{arm=false;d.textContent="Excluir"},3000)}else{S.items.splice(i,1);persist();render();toast("Modelo excluído")}};
  a.appendChild(e);a.appendChild(d);b.appendChild(a);c.appendChild(b);g.appendChild(c)});
}
function slots(){
 const w=$("slots");w.textContent="";
 pics.forEach((p,k)=>{
  const s=el("div","slot");
  if(p){s.style.backgroundImage="url("+p+")";const x=el("button","x","Remover");x.onclick=ev=>{ev.preventDefault();ev.stopPropagation();pics[k]=null;slots()};s.appendChild(x)}
  else s.appendChild(document.createTextNode(k<2?"Adicionar foto "+(k+1):"Foto 3 (opcional)"));
  const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=async()=>{if(f.files[0]){try{pics[k]=await shrink(f.files[0]);slots()}catch(e){toast("Não consegui ler essa foto.")}}};
  s.appendChild(f);w.appendChild(s)});
}
function shrink(file){return new Promise((ok,no)=>{
 const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const W=800,H=1067,c=document.createElement("canvas");c.width=W;c.height=H;
  const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;
  c.getContext("2d").drawImage(im,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.72))};
 im.onerror=no;im.src=u})}
function open(i){
 edit=i;const it=i==null?{name:"",desc:"",price:"",sizes:"",colors:"",photos:[]}:S.items[i];
 $("dt").textContent=i==null?"Novo modelo":"Editar modelo";
 $("fn").value=it.name;$("fd").value=it.desc;$("fp").value=it.price?String(it.price).replace(".",","):"";$("fs").value=it.sizes;$("fc").value=it.colors;
 pics=[it.photos[0]||null,it.photos[1]||null,it.photos[2]||null];slots();$("dlg").showModal();
}
$("add").onclick=()=>open(null);
$("cx").onclick=()=>$("dlg").close();
$("sv").onclick=()=>{
 const name=$("fn").value.trim(),ph=pics.filter(Boolean);
 if(!name)return toast("Digite o nome do modelo.");
 if(ph.length<2)return toast("Adicione pelo menos 2 fotos.");
 const price=parseFloat($("fp").value.replace(/\./g,"").replace(",","."))||0;
 const it={name,desc:$("fd").value.trim(),price,sizes:$("fs").value.trim(),colors:$("fc").value.trim(),photos:ph,inc:edit==null?true:S.items[edit].inc};
 const old=JSON.stringify(S);
 if(edit==null)S.items.unshift(it);else S.items[edit]=it;
 if(!persist()){S=JSON.parse(old);return}
 $("dlg").close();render();toast("Modelo salvo");
};
$("store").oninput=e=>{S.store=e.target.value;$("t").textContent=S.store||"Catálogo";persist()};
$("zap").oninput=e=>{S.zap=e.target.value;persist()};
$("pdf").onclick=async()=>{
 const list=S.items.filter(i=>i.inc!==false);
 if(!list.length)return toast("Marque pelo menos um modelo para o catálogo.");
 if(!window.jspdf)return toast("Biblioteca de PDF ainda carregando. Tente de novo.");
 const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
 list.forEach((it,n)=>{
  if(n)doc.addPage();
  doc.setTextColor(15,92,90);doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(S.store||"Catálogo",15,16);
  if(S.zap){doc.setFont("helvetica","normal");doc.setTextColor(93,100,112);doc.text("WhatsApp: "+S.zap,195,16,{align:"right"})}
  doc.addImage(it.photos[0],"JPEG",15,24,120,160);
  if(it.photos[1])doc.addImage(it.photos[1],"JPEG",140,24,60,80);
  if(it.photos[2])doc.addImage(it.photos[2],"JPEG",140,109,60,80);
  doc.setTextColor(22,24,29);doc.setFont("helvetica","bold");doc.setFontSize(22);
  let y=206;const t=doc.splitTextToSize(it.name,180);doc.text(t,15,y);y+=t.length*9;
  doc.setTextColor(15,92,90);doc.setFontSize(18);doc.text(money(it.price),15,y);y+=9;
  doc.setTextColor(60,66,76);doc.setFont("helvetica","normal");doc.setFontSize(12);
  if(it.desc){const d=doc.splitTextToSize(it.desc,180);doc.text(d,15,y);y+=d.length*5.5+3}
  if(it.sizes){doc.text("Tamanhos: "+it.sizes,15,y);y+=6}
  if(it.colors){doc.text("Cores: "+it.colors,15,y)}
 });
 doc.save("catalogo.pdf");toast("PDF pronto");
};
render();
</script></body></html>
